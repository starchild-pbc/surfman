name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  merge_group:
    types: [checks_requested]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  Build:
    name: ${{ format('{0} {1}', matrix.platform.target, matrix.features)}}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-15, test: true }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, test: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, test: false }
          - {
              target: aarch64-unknown-linux-ohos,
              os: ubuntu-24.04,
              test: false,
            }
          - { target: arm-linux-androideabi, os: ubuntu-24.04, test: false }
        features:
          [
            "",
            "chains sm-raw-window-handle-06",
            "chains sm-raw-window-handle-05",
          ]
        include:
          - features: "sm-x11"
            platform:
              { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, test: true }
          - features: "sm-x11 sm-wayland-default"
            platform:
              { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, test: true }
          - features: "chains sm-angle-builtin"
            platform:
              { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
          - features: "chains sm-no-wgl sm-angle-builtin"
            platform:
              { target: x86_64-pc-windows-msvc, os: windows-latest, test: true }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install gcc libxxf86vm-dev libosmesa6-dev libgles2-mesa-dev xvfb weston -y
      - name: Install LLVM and Clang
        if: ${{ !contains(matrix.platform.os, 'macos') }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"
      - name: Install rust
        id: toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.platform.target }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: |
          cargo build --features "${{ matrix.features }}" --target ${{ matrix.platform.target }}
      - name: Test
        if: ${{ matrix.platform.test && startsWith(matrix.platform.os, 'ubuntu') }}
        run: |
          weston --no-config --socket=wl-test-env --backend=headless &
          WAYLAND_DISPLAY=wl-test-env xvfb-run cargo nextest run --features "${{ matrix.features }}" --target ${{ matrix.platform.target }}
      - name: Test
        if: ${{ matrix.platform.test && !startsWith(matrix.platform.os, 'ubuntu') }}
        timeout-minutes: 30 # https://github.com/servo/surfman/issues/329
        run: |
          cargo nextest run --features "${{ matrix.features }}" --target ${{ matrix.platform.target }}

  android-test:
    name: ${{ format('x86_64-linux-android {0}', matrix.features)}}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          [
            "",
            "chains sm-raw-window-handle-06",
            "chains sm-raw-window-handle-05",
          ]
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        id: toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: x86_64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-dinghy

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests in android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RANLIB: "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cargo dinghy all-platforms
            cargo dinghy all-devices
            cargo dinghy -p auto-android-x86_64-api30 --env RUST_BACKTRACE=${{ env.RUST_BACKTRACE }} test --features "${{ matrix.features }}" -- --test-threads 1 --nocapture

  ios-device-test:
    name: iPhone 15 device test
    # GitHub does not give repository secrets to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: ios-device-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_BUILD_NAME: surfman-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        id: toolchain
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-apple-ios
      - name: Build the iOS test app
        run: ./ios-device-test/build.sh
      - name: Run on BrowserStack
        run: |
          ./ios-device-test/browserstack.sh \
            target/ios-device-test/surfman-ios-device-test.ipa \
            target/ios-device-test/artifacts
      - name: Add the session to the job summary
        if: always() && hashFiles('target/ios-device-test/artifacts/session-url.txt') != ''
        run: |
          printf 'BrowserStack session: %s\n' \
            "$(cat target/ios-device-test/artifacts/session-url.txt)" \
            >>"$GITHUB_STEP_SUMMARY"
      - name: Upload BrowserStack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ios-device-test/artifacts
          if-no-files-found: warn

  Format:
    name: Run `rustfmt`
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mkroening/rust-toolchain-toml@main
      - run: cargo fmt --check
  build_result:
    name: Result
    runs-on: ubuntu-24.04
    needs: ["Build", "android-test", "ios-device-test", "Format"]
    if: always()
    steps:
      - name: Mark the job as successful
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: Mark the job as unsuccessful
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
